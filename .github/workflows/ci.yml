name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff pyinstaller
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q main.py chatplays tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Import UI
        run: python -c "import tkinter; import chatplays.ui"
      - name: Build Windows executable
        run: pyinstaller --clean --onefile --windowed --name ChatPlays main.py
      - name: Smoke-test executable
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/ChatPlays.exe"
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 4
            $process.Refresh()
            if ($process.HasExited) {
              throw "ChatPlays.exe exited during startup with code $($process.ExitCode)"
            }
          }
          finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
